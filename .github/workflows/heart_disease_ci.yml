name: Heart Disease MLOps CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  api-and-bundle-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt pytest httpx

      - name: Verify Production ModelLoader bundle
        run: python api/model_loader.py

      - name: Run Heart Disease FastAPI test suite
        run: python -m pytest tests/test_api.py -v
